<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">The School Manager</title>
  <!--
    THE ONE MARK. Everything else is generated from this file by
    scripts/build-icons.mjs: the favicon Google shows, the browser tab, the
    Android and iOS home-screen icons, and the app's own icon.

    Two ids are load-bearing and must not be renamed. The build script reaches
    for them to produce the variants:
      plate  the rounded square. Squared off (rx="0") for the iOS and maskable
             icons, because both of those get their own mask applied on top and
             transparent corners would show through as black.
      mark   the cap. Scaled down and re-centred for the maskable icon, which
             Android crops to a circle 80% of the width.

    GEOMETRY IS TUNED FOR 16px, not for this preview. Google renders the
    favicon at 16 CSS pixels. In the previous mark the gap between the cap and
    the base below it was 7 units out of 512, which is 0.2 of a pixel at that
    size: it closed completely and the whole thing became a white blob. The gap
    here is 21 units, so it survives the downscale. Checked by rendering it at
    16, 24, 32 and 48 and looking, not by assuming.

    The colour is #4F46E5: the brand indigo the website sets as its brand
    custom property and the app calls brand-600. The mark used to be #1d4ed8,
    which is Tailwind blue rather than the brand, so the icon was a different
    colour from every screen it sat next to.

    Careful with the wording in here. XML forbids a double hyphen inside a
    comment, and this file is loaded as an external image by the nav and the
    footer, where a browser parses it as XML and refuses the whole file if it
    is not well formed. It refuses it silently: the logo is simply absent.
    Rendering the same markup INLINE in a page works, because HTML parsing is
    lenient, so the icon generator kept producing perfect PNGs from a file no
    browser would load. That is exactly how this shipped broken once already.
  -->
  <rect id="plate" width="512" height="512" rx="96" fill="#4F46E5"/>
  <g id="mark" fill="#ffffff">
    <path d="M256 112 464 196 256 280 48 196 256 112Z"/>
    <path d="M148 258 148 344 C148 344 192 382 256 382 C320 382 364 344 364 344 L364 258 256 302 148 258Z"/>
    <rect x="452" y="192" width="18" height="96" rx="9"/>
    <circle cx="461" cy="304" r="22"/>
  </g>
</svg>
