name: Desktop (Windows installer)

# Manual/tag-triggered only — it never runs on ordinary pushes or PRs, so it
# can't gate the main CI. Fire it from the Actions tab (Run workflow) or by
# pushing a version tag like v1.0.0.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build Windows .msi
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.toml') }}

      - name: Install desktop tooling
        working-directory: desktop
        run: npm install

      - name: Generate app icons (from app-icon.svg)
        working-directory: desktop
        run: npx tauri icon app-icon.svg

      - name: Build the installer
        working-directory: desktop
        run: npx tauri build --bundles msi

      - name: Upload the .msi
        uses: actions/upload-artifact@v4
        with:
          name: school-manager-windows-msi
          path: desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
