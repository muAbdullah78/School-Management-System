name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  web:
    name: Web build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck & build
        run: npm run build
      - name: Unit tests
        run: npm test

  migrations:
    name: Migrations apply on Postgres 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Stub the Supabase auth schema
        # The app runs on Supabase, which provides auth.users / auth.uid() and the
        # anon/authenticated roles. Recreate just enough of that surface so the
        # migrations apply exactly as they would on a real project.
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists auth;
          create table if not exists auth.users (
            id uuid primary key,
            email text,
            raw_user_meta_data jsonb default '{}'::jsonb,
            -- app_metadata. Real GoTrue has always had this column; the stub
            -- did not, and 0065 moved every authorisation decision onto it
            -- (only the service role can write it, so a browser signUp cannot
            -- forge a role). Without it here, handle_new_user raises
            -- "record new has no field raw_app_meta_data" on every signup.
            raw_app_meta_data jsonb default '{}'::jsonb
          );
          create or replace function auth.uid() returns uuid language sql stable as $$ select null::uuid $$;
          do $$ begin
            if not exists (select 1 from pg_roles where rolname='anon') then create role anon nologin; end if;
            if not exists (select 1 from pg_roles where rolname='authenticated') then create role authenticated nologin; end if;
          end $$;
          SQL
      - name: Apply all migrations in order
        # --single-transaction is not a nicety, it is the point.
        #
        # Schools apply these by pasting each file into the Supabase SQL
        # Editor, which runs the whole file as ONE transaction. Plain psql
        # autocommits every statement instead, so the two behave differently —
        # and a migration that did `alter type ... add value` and then USED the
        # new value passed here while failing for every real school
        # (ERROR 55P04: unsafe use of new value).
        #
        # Applying each file in a single transaction makes CI match the way the
        # migrations are actually run, so that class of bug fails the build.
        run: |
          for f in supabase/migrations/*.sql; do
            echo "── applying $f (single transaction, as the SQL Editor does)"
            psql -v ON_ERROR_STOP=1 -q --single-transaction -f "$f"
          done
      - name: Bundles match the migrations
        # supabase/bundles/ is what a school actually pastes into the SQL
        # Editor. If it drifts from supabase/migrations/, schools install
        # something we never tested. Regenerate and diff.
        run: |
          ./supabase/build-bundles.sh
          if ! git diff --exit-code --stat supabase/bundles/; then
            echo "::error::supabase/bundles/ is stale — run ./supabase/build-bundles.sh and commit"
            exit 1
          fi
          echo "bundles are in sync with the migrations"
      - name: Bundles apply as single transactions
        # The real install path, on a separate database: each bundle as ONE
        # transaction, exactly as the SQL Editor runs a paste. Globbed, so a new
        # bundle is covered the moment build-bundles.sh emits it.
        run: |
          psql -v ON_ERROR_STOP=1 -c "create database bundlecheck;"
          PGDATABASE=bundlecheck psql -v ON_ERROR_STOP=1 -q <<'SQL'
          create schema if not exists auth;
          create table if not exists auth.users (
            id uuid primary key, email text, raw_user_meta_data jsonb default '{}'::jsonb,
            raw_app_meta_data jsonb default '{}'::jsonb);
          create or replace function auth.uid() returns uuid language sql stable as $$ select null::uuid $$;
          do $$ begin
            if not exists (select 1 from pg_roles where rolname='anon') then create role anon nologin; end if;
            if not exists (select 1 from pg_roles where rolname='authenticated') then create role authenticated nologin; end if;
            if not exists (select 1 from pg_roles where rolname='service_role') then create role service_role nologin; end if;
          end $$;
          SQL
          for b in supabase/bundles/*.sql; do
            echo "── $b"
            PGDATABASE=bundlecheck psql -v ON_ERROR_STOP=1 -q --single-transaction -f "$b"
          done
          echo "all bundles applied cleanly"

          # The check a SCHOOL runs after installing, run against the install a
          # school actually performs. This is the only place the bundle path and
          # verify.sql meet, and it is where the missing-bundle-4 problem would
          # have been caught: bundles 1-3 alone reported every row PASS while the
          # fee counter, challan, reports and enquiry book were all absent.
          echo "── verify.sql, as a school runs it"
          PGDATABASE=bundlecheck psql -v ON_ERROR_STOP=1 -f supabase/verify.sql \
            | tee /tmp/verify.out
          if grep -q 'FAIL' /tmp/verify.out; then
            echo "::error::verify.sql reports a FAIL against a fresh bundle install"
            exit 1
          fi
          echo "verify.sql is all PASS on a bundle-only install"
      - name: verify.sql and detect.sql cover the same migrations
        # They are two lists of the same facts, maintained by hand, and they drifted
        # once already: verify.sql checked 0033 then jumped to 0038-0046, so a real
        # school got all PASS while 0036 (the family-linkage fix) and 0037 were
        # MISSING. verify.sql certified a database on which sibling billing did not
        # work.
        #
        # A subset check reports health it has not measured. This asserts both files
        # name every migration in the range where a gap can occur.
        run: |
          fail=0
          # 0035-0049: the scattered-gap range. Three artefacts must agree — a
          # named literal in verify.sql, a row in detect.sql, and a repair file.
          for n in 0035 0036 0037 0038 0039 0040 0041 0042 0043 0044 0045 0046 0047 0048 0049; do
            grep -q "'$n'" supabase/verify.sql || { echo "verify.sql does not check $n"; fail=1; }
            grep -q "'${n}_" supabase/repair/detect.sql || { echo "detect.sql does not check $n"; fail=1; }
            test -f "supabase/repair/${n}_"*.sql || { echo "no repair file for $n"; fail=1; }
          done
          # 0050 to the newest migration on disk. No repair files here — the
          # migration itself is the remedy — but "is my database up to date?"
          # must not silently stop answering at 0049. Derived from the directory
          # rather than a hand-kept list, so the next migration is covered the
          # day it lands instead of the day somebody remembers this file.
          for f in supabase/migrations/*.sql; do
            n=$(basename "$f" | cut -c1-4)
            [ "$n" \> "0049" ] || continue
            grep -q "$n" supabase/verify.sql || { echo "verify.sql never mentions $n"; fail=1; }
            grep -q "'${n}_" supabase/repair/detect.sql || { echo "detect.sql does not check $n"; fail=1; }
          done
          if [ "$fail" = 1 ]; then
            echo "::error::the install checks and the repair files have drifted apart"
            exit 1
          fi
          echo "verify.sql and detect.sql cover every migration from 0035 to $(ls supabase/migrations/*.sql | tail -1 | xargs basename | cut -c1-4)"

      - name: An EXISTING school can upgrade
        # THE JOB THAT WAS MISSING, and its absence cost a real school fifteen
        # migrations.
        #
        # Everything else here tests a FRESH install: all bundles, in order, on an
        # empty database. That is not how an existing school upgrades, and the
        # upgrade path was broken for months without one red tick.
        #
        # What happened. Bundle 3's glob is 003[3-9]*. It kept absorbing new
        # migrations AFTER it had already shipped, so the file a school had
        # already pasted changed underneath them — and different schools stopped
        # at different points inside it. Re-running it fails on 0033's "column
        # family_id already exists" and, because a bundle is ONE transaction,
        # rolls back entirely, so nothing later in the file arrives.
        #
        # The real report stopped at 0037: migrations 0038 and 0039 were missing
        # and everything else was present. I first GUESSED the cutoff was 0034,
        # built a fifteen-migration repair on that guess, and it failed on its
        # first statement because the school already had 0035. That is why the
        # repair is now ONE FILE PER MIGRATION plus a detect.sql that asks the
        # database instead of inferring — and why this step stops at 0037, the
        # cutoff that actually occurred.
        run: |
          psql -v ON_ERROR_STOP=1 -c "create database upgradecheck;"
          export PGDATABASE=upgradecheck
          psql -v ON_ERROR_STOP=1 -q <<'SQL'
          create schema if not exists auth;
          create table if not exists auth.users (
            id uuid primary key, email text, raw_user_meta_data jsonb default '{}'::jsonb,
            raw_app_meta_data jsonb default '{}'::jsonb);
          create or replace function auth.uid() returns uuid language sql stable as $$ select null::uuid $$;
          do $$ begin
            if not exists (select 1 from pg_roles where rolname='anon') then create role anon nologin; end if;
            if not exists (select 1 from pg_roles where rolname='authenticated') then create role authenticated nologin; end if;
            if not exists (select 1 from pg_roles where rolname='service_role') then create role service_role nologin; end if;
          end $$;
          SQL

          echo "── the school as it was: migrations 0001-0037 (the real cutoff)"
          for f in supabase/migrations/*.sql; do
            n=$(basename "$f" | cut -c1-4)
            if [ "$n" -le 0037 ]; then
              psql -v ON_ERROR_STOP=1 -q --single-transaction -f "$f"
            fi
          done

          echo "── they paste every current bundle, as instructed. 1-3 fail; that is the bug."
          for b in supabase/bundles/[1-5]_*.sql; do
            if psql -v ON_ERROR_STOP=1 -q --single-transaction -f "$b" >/dev/null 2>&1; then
              echo "   $b applied"
            else
              echo "   $b refused (already-applied content — expected for 1 and 3)"
            fi
          done

          echo "── detect.sql must name the gap, not guess it"
          psql -v ON_ERROR_STOP=1 -f supabase/repair/detect.sql | tee /tmp/detect.out
          for m in 0038_counter 0039_challan; do
            grep -q "$m.*MISSING" /tmp/detect.out || { echo "::error::detect.sql failed to spot $m"; exit 1; }
          done

          echo "── the repair, driven by the ACTION COLUMN detect.sql prints"
          # ONLY the files detect.sql marked MISSING, in the order it names them.
          # Applying the whole repair directory blindly is what the school was
          # told to do the first time and it fails on its first statement —
          # reproduced here, deliberately, before this loop was written:
          #   ERROR: column "effective_from" of relation "fee_structures"
          #          already exists
          # A repair must be driven by what the database is missing, never by a
          # fixed list.
          #
          # It must also be driven by the PATH detect.sql prints, not by a path
          # reconstructed from the migration name. This loop used to do the
          # latter — `supabase/repair/$name.sql` — and broke the moment detect.sql
          # was extended past 0049, because 0050 onward have no repair file and
          # their action column says `run supabase/migrations/...` instead:
          #   psql: error: supabase/repair/0057_photos_and_logo.sql:
          #                No such file or directory
          # The job was ignoring the very instruction it exists to test. Reading
          # field 4 makes it follow exactly what a school is shown.
          awk -F'|' '/MISSING/ {
            name = $1; gsub(/ /, "", name)
            act  = $4; sub(/^ *run */, "", act); gsub(/ *$/, "", act)
            print name "\t" act
          }' /tmp/detect.out | sort | while IFS=$'\t' read -r m path; do
            echo "   applying $path"
            test -f "$path" || { echo "::error::detect.sql named a file that does not exist: $path"; exit 1; }
            psql -v ON_ERROR_STOP=1 -q --single-transaction -f "$path"
          done

          # Then the LAST TWO bundles in order, so the newest definitions win
          # back. Bundle 5 alone is not enough any more and getting this wrong is
          # silent: the repair files for 0035-0049 restore definitions that later
          # migrations superseded, and bundle 5 carries 0050-0056 — several of
          # whose function bodies 0059 rewrites. Re-running bundle 5 LAST would
          # put the has_role read gates back and quietly undo the observer role.
          psql -v ON_ERROR_STOP=1 -q --single-transaction -f supabase/bundles/5_search.sql
          psql -v ON_ERROR_STOP=1 -q --single-transaction -f supabase/bundles/6_photos_and_records.sql

          echo "── verify.sql, as the school runs it"
          psql -v ON_ERROR_STOP=1 -f supabase/verify.sql | tee /tmp/upgrade.out
          if grep -q 'FAIL' /tmp/upgrade.out; then
            echo "::error::an existing school cannot reach a green verify.sql"
            exit 1
          fi
          echo "an existing school upgrades to all PASS"

      - name: Sanity checks
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          -- A school must exist before anything else: every tenant row hangs off
          -- one, and next_counter() resolves its series from the caller's school.
          insert into public.schools(id, name)
            values ('99999999-9999-9999-9999-999999999999', 'CI School');
          insert into public.subscriptions(school_id, plan_code, status, trial_ends_on)
            values ('99999999-9999-9999-9999-999999999999', 'starter', 'active', current_date + 14);
          -- new auth user is auto-provisioned as owner (first user IN THIS SCHOOL)
          insert into auth.users(id, email, raw_user_meta_data)
            values ('11111111-1111-1111-1111-111111111111', 'owner@ci.test',
                    '{"full_name":"CI Owner","school_id":"99999999-9999-9999-9999-999999999999"}');
          select case when (select role::text from public.profiles
                            where id='11111111-1111-1111-1111-111111111111') = 'owner'
                  then 'provisioning ok' else 'PROVISIONING FAIL' end;
          select case when (select school_id from public.profiles
                            where id='11111111-1111-1111-1111-111111111111')
                            = '99999999-9999-9999-9999-999999999999'
                  then 'tenant binding ok' else 'TENANT BINDING FAIL' end;
          -- Act as that owner from here on, so school_id is auto-stamped on every
          -- insert below and next_counter() has a school to count within.
          create or replace function auth.uid() returns uuid language sql stable as
            $$ select '11111111-1111-1111-1111-111111111111'::uuid $$;
          -- gapless counter helper works
          select case when public.next_counter('ci_test') = 1
                       and public.next_counter('ci_test') = 2
                  then 'counter ok' else 'COUNTER FAIL' end;
          -- bulk import: act as the owner, seed minimal reference data, then import
          -- a batch by class/section NAME and assert the tally. Raises (fails CI)
          -- on any mismatch — a good row created, a nameless row + unknown-class
          -- row rejected, nothing else.
          create or replace function auth.uid() returns uuid language sql stable as
            $$ select '11111111-1111-1111-1111-111111111111'::uuid $$;
          insert into public.academic_sessions(id, name, is_current)
            values ('22222222-2222-2222-2222-222222222222', '2025-2026', true);
          insert into public.classes(id, name, level_order)
            values ('33333333-3333-3333-3333-333333333333', 'Class 1', 1);
          insert into public.sections(class_id, name)
            values ('33333333-3333-3333-3333-333333333333', 'A');
          do $CI$
          declare j jsonb;
          begin
            j := public.fn_import_students(
              '22222222-2222-2222-2222-222222222222',
              '[{"full_name":"Import Test","class":"Class 1","section":"A"},
                {"full_name":"","class":"Class 1"},
                {"full_name":"No Class","class":"Nope"}]'::jsonb,
              false);
            if not (j->>'total' = '3' and j->>'created' = '1'
                    and j->>'errors' = '2' and j->>'skipped' = '0') then
              raise exception 'IMPORT FAIL: %', j;
            end if;
            if (select count(*) from public.students where full_name = 'Import Test') <> 1 then
              raise exception 'IMPORT FAIL: student not on roster';
            end if;
            raise notice 'import ok';
          end $CI$;
          -- opening fee-balance import: give the imported student arrears and assert
          -- it flows into student_balance() and fn_defaulters().
          do $CI$
          declare sid uuid; g text; bal numeric;
          begin
            select id, gr_no into sid, g from public.students where full_name = 'Import Test';
            perform public.fn_import_opening_balances(
              '22222222-2222-2222-2222-222222222222',
              jsonb_build_array(jsonb_build_object('gr_no', g, 'amount', 'Rs 1,500')),
              false);
            bal := public.student_balance(sid);
            if bal <> 1500 then raise exception 'BALANCE FAIL: student_balance=%', bal; end if;
            if not exists (select 1 from public.fn_defaulters('22222222-2222-2222-2222-222222222222')
                           where student_id = sid) then
              raise exception 'BALANCE FAIL: student not a defaulter';
            end if;
            -- re-running is idempotent (skipped, not doubled)
            perform public.fn_import_opening_balances(
              '22222222-2222-2222-2222-222222222222',
              jsonb_build_array(jsonb_build_object('gr_no', g, 'amount', '1500')),
              false);
            if public.student_balance(sid) <> 1500 then
              raise exception 'BALANCE FAIL: re-import double-counted (%).', public.student_balance(sid);
            end if;
            raise notice 'opening balance import ok';
          end $CI$;
          -- year-end rollover: promote the imported student into a new session and
          -- assert the new enrolment exists, arrears carry, and undo reverses it.
          do $CI$
          declare sid uuid; r jsonb; cnt int;
          begin
            select id into sid from public.students where full_name = 'Import Test';
            insert into public.academic_sessions(id, name) values
              ('44444444-4444-4444-4444-444444444444', '2026-2027');
            insert into public.classes(id, name, level_order) values
              ('55555555-5555-5555-5555-555555555555', 'Class 2', 2);
            -- preview writes nothing
            perform public.fn_rollover('22222222-2222-2222-2222-222222222222',
              '44444444-4444-4444-4444-444444444444', '[]'::jsonb, false);
            if exists (select 1 from public.enrollments where session_id = '44444444-4444-4444-4444-444444444444') then
              raise exception 'ROLLOVER FAIL: preview wrote enrolments';
            end if;
            -- commit: Class 1 -> Class 2 (next by level_order)
            r := public.fn_rollover('22222222-2222-2222-2222-222222222222',
              '44444444-4444-4444-4444-444444444444', '[]'::jsonb, true);
            if (r->>'promoted') <> '1' then raise exception 'ROLLOVER FAIL: %', r; end if;
            select count(*) into cnt from public.enrollments e
              join public.classes c on c.id = e.class_id
              where e.session_id = '44444444-4444-4444-4444-444444444444'
                and e.student_id = sid and c.name = 'Class 2' and e.promoted_from is not null;
            if cnt <> 1 then raise exception 'ROLLOVER FAIL: new enrolment missing'; end if;
            -- arrears (1500 opening balance) carry into the new session's defaulters
            if not exists (select 1 from public.fn_defaulters('44444444-4444-4444-4444-444444444444')
                           where student_id = sid) then
              raise exception 'ROLLOVER FAIL: arrears did not carry';
            end if;
            -- undo removes the new enrolment
            perform public.fn_rollover_undo('44444444-4444-4444-4444-444444444444');
            if exists (select 1 from public.enrollments where session_id = '44444444-4444-4444-4444-444444444444') then
              raise exception 'ROLLOVER FAIL: undo left enrolments';
            end if;
            raise notice 'rollover ok';
          end $CI$;
          -- staff import: one good row created, a nameless row rejected.
          do $CI$
          declare j jsonb;
          begin
            j := public.fn_import_staff(
              '[{"full_name":"Test Teacher","designation":"Teacher","employee_no":"E1"},
                {"full_name":""}]'::jsonb, false);
            if not (j->>'total' = '2' and j->>'created' = '1' and j->>'errors' = '1') then
              raise exception 'STAFF IMPORT FAIL: %', j;
            end if;
            if (select count(*) from public.staff where full_name = 'Test Teacher') <> 1 then
              raise exception 'STAFF IMPORT FAIL: not inserted';
            end if;
            raise notice 'staff import ok';
          end $CI$;
          -- fee ops: fine / adjustment / waive / approved-discount all move the
          -- balance correctly (isolated in its own class so nothing else is touched).
          insert into public.classes(id, name, level_order)
            values ('77777777-7777-7777-7777-777777777777', 'Fee Class', 5);
          insert into public.fee_heads(id, name, type, is_recurring)
            values ('66666666-6666-6666-6666-666666666666', 'Tuition', 'monthly', true);
          insert into public.fee_structures(session_id, class_id, fee_head_id, amount)
            values ('22222222-2222-2222-2222-222222222222', '77777777-7777-7777-7777-777777777777',
                    '66666666-6666-6666-6666-666666666666', 1000);
          do $CI$
          declare sid uuid; enr uuid; inv uuid; did uuid;
          begin
            perform public.fn_import_students('22222222-2222-2222-2222-222222222222',
              '[{"full_name":"Fee Test","class":"Fee Class","gr_no":"FEE1"}]'::jsonb, false);
            select id into sid from public.students where gr_no = 'FEE1';
            select id into enr from public.enrollments where student_id = sid;
            perform public.fn_generate_class_invoices('22222222-2222-2222-2222-222222222222',
              '77777777-7777-7777-7777-777777777777', '2025-08-01', '2025-08-10');
            select id into inv from public.invoices where student_id = sid limit 1;
            if public.student_balance(sid) <> 1000 then raise exception 'FEE base %', public.student_balance(sid); end if;
            perform public.fn_apply_fine(inv, 200, 'late');
            if public.student_balance(sid) <> 1200 then raise exception 'FEE fine %', public.student_balance(sid); end if;
            perform public.fn_add_adjustment(sid, -300, 'hardship');
            if public.student_balance(sid) <> 900 then raise exception 'FEE adj %', public.student_balance(sid); end if;
            perform public.fn_waive_fine(inv, 'goodwill');
            if public.student_balance(sid) <> 700 then raise exception 'FEE waive %', public.student_balance(sid); end if;
            did := public.fn_add_discount(enr, 'sibling', 10, true, 'sib');
            perform public.fn_set_discount_status(did, 'approved');
            perform public.fn_generate_class_invoices('22222222-2222-2222-2222-222222222222',
              '77777777-7777-7777-7777-777777777777', '2025-09-01', '2025-09-10');
            if public.student_balance(sid) <> 1600 then raise exception 'FEE sep %', public.student_balance(sid); end if;
            raise notice 'fee ops ok';
          end $CI$;
          -- fee reconciliation runs and totals are coherent (expected >= collected > = 0).
          do $CI$
          declare j jsonb;
          begin
            j := public.fn_fee_reconciliation('22222222-2222-2222-2222-222222222222');
            if (j->>'expected')::numeric <= 0 then raise exception 'RECON expected %', j; end if;
            if (j->>'expected')::numeric < (j->>'collected')::numeric then raise exception 'RECON collected>expected %', j; end if;
            raise notice 'reconciliation ok';
          end $CI$;
          SQL
      - name: Cross-tenant isolation
        # Stands up two schools and tries to reach one from the other — direct
        # reads, direct writes, and passing the other school's ids into every
        # SECURITY DEFINER function. Any success fails the build.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/tenant_isolation.sql
      - name: Subscription & student-limit rules
        # Trial -> grace -> locked -> reactivated, and the rule that going over
        # the student limit flags the school without ever blocking an admission.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/subscription_rules.sql
      - name: Finance — expenses, profit, till control
        # Fee income cannot be hand-entered, reversals net to zero, a drawer
        # that does not balance cannot be closed without a reason, and a closed
        # till's variance is frozen against later activity.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/finance.sql
      - name: Portal isolation — parents see only their own children
        # The highest-stakes suite in the project. Asserts a parent account has
        # ZERO direct table access, cannot reach another family through any
        # portal function, cannot tell "no such student" from "not yours", and
        # that each protected table has exactly ONE SELECT policy which checks
        # is_staff() — RLS policies OR together, so a leftover policy under an
        # old name silently re-opens a table.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/portal.sql
      - name: Message outbox — receipts queued with the POST-payment balance
        # The receipt trigger is DEFERRED on purpose: a plain AFTER INSERT fires
        # before allocation and would quote every parent the balance they had
        # BEFORE paying. Also asserts reversals and pending challans queue
        # nothing, and that a family with no phone never blocks a payment.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/outbox.sql
      - name: Fee operations — effective dating, the annual raise, vouchers
        # A raise dated 1 April must not change March. Preview writes nothing
        # and commits exactly what it showed. Every challan carries a unique
        # scannable code that resolves to the family.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/fee_ops.sql
      - name: Family billing — allocation, credit, conservation
        # One father, three children, one payment. Asserts allocation is oldest
        # month first ACROSS siblings, that an overpayment becomes family credit
        # instead of a negative student, and that
        #   family_outstanding = sum(student_balance) - family_credit
        # holds at every step.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/family_money.sql

      - name: RPC contract — do the app's calls match the database?
        # The seam nothing else checks. `sb.rpc('fn_x', {...})` is an untyped
        # string and an untyped object, so a renamed function or a renamed
        # parameter typechecks, builds, deploys, and fails the first time a
        # school opens the screen. Both of these actually shipped and were found
        # by hand: publishResults passed `p_term_id` where the function takes
        # `p_exam_term_id`, and a call had fn_record_expense's arguments in the
        # wrong order.
        #
        # Verified to fail on both faults deliberately re-introduced.
        run: ./supabase/check-rpc-contract.sh

      - name: Is every function the app may call reachable from anywhere?
        # The most common defect in this repo has never been wrong logic — it has
        # been correct logic nothing could reach. fn_link_parent, fn_family_for,
        # fn_find_by_voucher, message_templates.enabled, profiles.active,
        # result_cards.published_at and fn_reverse_other_income all shipped,
        # passed CI, and did nothing. Every one was found by hand, late.
        #
        # This asks the catalogue instead: for each function granted to
        # `authenticated`, is it named by another function, a trigger, an RLS
        # policy, a default, a check, an index, a view, or by web/src? If not it
        # is either a feature with no way to use it, or dead code that
        # `authenticated` can nonetheless EXECUTE.
        #
        # Verified by planting fn_planted_orphan() and confirming this fails.
        run: ./supabase/check-reachable.sh

      - name: Is every column used by something?
        # The column-level twin, and it exists because the function check cannot
        # see the worst bug of this kind we have had: profiles.active was WRITTEN
        # by the Settings screen and read by NOTHING, so "Deactivate" left a
        # dismissed clerk with full access.
        #
        # A column nothing reads is a promise the software does not keep; a
        # column nothing writes is a feature designed and never built. Thirteen
        # existing ones are listed as a baseline in the script and in
        # docs/PARITY.md; any NEW one fails the build.
        #
        # Verified by adding students.planted_dead_col and confirming this fails.
        run: ./supabase/check-columns-used.sh

      - name: Can a signed-in user actually WRITE the tables?
        # A CHECK constraint's function runs with the privileges of whoever is
        # writing the row — not the table's owner, not the function's owner. So a
        # constraint calling a function `authenticated` cannot execute makes the
        # table completely unwritable, and the error mentions the function rather
        # than the table.
        #
        # THIS SHIPPED. 0057 put a CHECK on students.photo_path, staff.photo_path
        # and school_settings.logo_path calling fn_photo_path_ok, then revoked
        # that function from PUBLIC — the default grant that was the only reason
        # it worked — without granting it to authenticated:
        #
        #   set local role authenticated;
        #   insert into public.students (...) values (...);
        #   ERROR:  permission denied for function fn_photo_path_ok
        #
        # Admitting a child. Adding a teacher. Saving the school's own address.
        # Nothing caught it because every suite writes those tables AS THE TABLE
        # OWNER, and the owner bypasses both RLS and function-privilege checks.
        # The constraint was well tested — from a position where the privilege
        # question cannot arise.
        #
        # Verified by revoking the grant again and confirming this fails.
        run: ./supabase/check-constraint-functions.sh

      - name: Is every QUERY inside a definer function scoped?
        # dashboard.sql assertion 20 asks whether a SECURITY DEFINER function
        # MENTIONS scoping anywhere in its body. That guard is worth having and
        # it is not enough: fn_rollover called assert_own on two session ids and
        # had eight unscoped queries behind that one mention. One correct check
        # exempted eight incorrect ones, and the result was that a school's
        # year-end rollover promoted its children into ANOTHER SCHOOL'S
        # classroom — five consecutive runs, in the ordinary case of two schools
        # with the same class ladder.
        #
        # This looks for the shape a whole-function check cannot see. Tenant
        # scope CHAINS through identity (`i.id = al.invoice_id`) and does NOT
        # chain through a value comparison (`c2.level_order > c.level_order`).
        # So it flags correlated predicates that compare two non-id columns with
        # an inequality, inside a subquery over a tenant table with no school_id
        # nearby.
        #
        # Deliberately narrow. A broad version flagged 65 of 157 functions and
        # every top candidate was a false positive — correlated subqueries
        # anchored to a scoped outer row, which the script cannot see because
        # the anchor is an outer alias. A guard that cries wolf 65 times gets
        # ignored, and then it protects nothing.
        #
        # Verified by restoring the pre-0055 fn_rollover and confirming this
        # names the exact line and exits 1.
        run: python3 ./supabase/check-definer-queries.py

      - name: Are per-school key lookups scoped?
        # gr_no, admission_no, employee_no, roll_no, receipt_no and voucher_no
        # are PER-SCHOOL counters. Every school on the platform has a GR 0001.
        #
        # This class has now shipped three times, in three separate importers —
        # the tools a school uses on its FIRST DAY. 0042 diagnosed it correctly
        # for staff ("importing staff rejected rows as duplicates because ANOTHER
        # school already used that employee number") and fixed one of the three.
        # 0056 found the other two: the student importer told a school "GR 0001
        # already exists" about another school's pupil, so a school could not
        # finish its first bulk import; and the opening-balance importer resolved
        # rows to another school's child and then failed with "Student is not
        # enrolled in the selected session" about a pupil who is.
        #
        # A careful sweep already happened here and was right, and two instances
        # still shipped. That is the argument for a tripwire over another sweep.
        #
        # Verified by unscoping fn_import_students' GR check and confirming this
        # names the line and exits 1.
        run: python3 ./supabase/check-import-keys.py

      - name: Can an observer write anywhere?
        # `readonly` reads everything a staff member reads and writes nothing.
        # The read half rests on ONE helper —
        #
        #   may_view(roles) := has_role(roles) or has_role('readonly')
        #
        # — and the whole guarantee is that the helper never reaches a write. It
        # is one replace() away from doing so, and the change would look exactly
        # like the forty-odd correct ones around it. A code review does not
        # reliably catch that; the catalogue does.
        #
        # It also refuses to pass when may_view is used in fewer than thirty
        # places. A migration that dropped the helper and reverted every read gate
        # would otherwise pass by having nothing left to find — and would silently
        # put `readonly` back to seeing empty screens.
        #
        # Verified by pointing students_write at may_view and confirming this
        # names the policy and exits 1.
        run: python3 ./supabase/check-readonly-writes.py

      - name: Reports — does the statement agree with the Accounts screen?
        # Assertion 6 is the point of this suite: the debit-and-credit statement
        # must net to the same profit fn_finance_summary reports for the same
        # dates. Two screens disagreeing about one month is the fastest way to
        # lose a school's trust, and both derive from the same rows so there is
        # no excuse for it. Also asserts a pending payment is not income, a
        # reversal shows as its own line rather than being netted away, and the
        # money reports follow fn_finance_summary's role boundary.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/reports.sql

      - name: Balance sheet — is the position AS AT a date, or just today's?
        # The obvious implementation of an as-at report is to sum
        # student_balance(), which ignores dates entirely and prints today's
        # position under yesterday's heading. The first cut of this function did
        # the money as-at but took the headcount from student_balance(), so a
        # date before the school billed anything reported "receivable 0,
        # students owing 1" — a statement contradicting itself in two adjacent
        # numbers. Assertion 10 sweeps 17 dates for exactly that.
        #
        # Assertions 6 and 7 are the load-bearing ones: a parent paying August
        # in July has NOT settled an August charge that does not exist yet, so
        # that money is a liability. Getting it wrong makes a school that
        # collects advance fees look like it owes nobody anything. Assertion 11
        # is the cross-check — receivable must equal the sum of every student
        # ledger, or two screens disagree about the same money.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/balance_sheet.sql

      - name: Enquiries — does the lead get followed up, and converted only once?
        # A lead list nobody calls is a list nobody reads, so the load-bearing
        # rules are that no open enquiry can be invisible (assertions 6 and 46:
        # a follow-up date is always defaulted, and the summary reports any that
        # slipped through) and that the list is ordered by who has waited
        # longest rather than who called last (31).
        #
        # Assertion 26 is the one that protects real data: converting the same
        # enquiry twice would burn a second GR number and leave a duplicate
        # child for somebody to unpick by hand. 27 proves no student was created
        # by the refused attempt.
        #
        # Assertions 66-66d check DELETE and UPDATE by ROW COUNT rather than by
        # catching an error, because a DELETE with no matching RLS policy
        # silently affects zero rows — a test waiting for an exception there
        # would quietly stop testing anything.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/enquiries.sql

      - name: Corrections — can a school SEE that a mark was changed?
        # mark_entries and attendance_daily have recorded `corrected_from` all
        # along and NOTHING ever read it, while `correction_reason` was never
        # written at all. So the system knew a teacher changed a mark from 45 to
        # 40 the night before results, and no principal could see it and no
        # parent disputing it could be answered.
        #
        # Assertion 1 is load-bearing for a different reason: the three entry
        # functions had to be DROPPED and recreated to gain the reason parameter
        # (create-or-replace cannot add one — it makes an ambiguous overload), so
        # this proves the existing two-argument callers, the app among them, all
        # still work.
        #
        # Assertion 20 is the point of the role boundary: a subject teacher can
        # ENTER marks, which is exactly why they must not be able to audit them.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/corrections.sql

      - name: Remarks and position holders — do ties and remarks survive?
        # Assertion 12 is why exam_remarks is its own table rather than a column
        # on result_cards: fn_generate_result_cards INSERTS a new version rather
        # than updating, so a remark stored on the card would silently vanish
        # from the printed report the moment anybody regenerated the class.
        # Assertion 11 proves that risk is real by counting the versions.
        #
        # Assertions 2-4 are the prize-distribution rules: two children on 90%
        # are BOTH first and the next is THIRD. Any other behaviour hands one
        # child a prize and not the other on a tie-break nobody chose.
        #
        # Assertion 9 records a modelling trap: an unmarked child scores 0.00,
        # NOT null, so percentage cannot distinguish "never marked" from "sat and
        # scored nothing". The function tests for a mark row instead.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/remarks_positions.sql

      - name: Search and birthdays
        # Assertion 10 is the practical one: phone numbers are typed as
        # 0300-111 2233, 03001112233 and +92 300 111 2233, so both sides are
        # reduced to digits before comparing. A search that only matches the
        # stored formatting is a search nobody trusts.
        #
        # Assertion 13 guards a genuine trap: `exact` is built from comparisons
        # against nullable columns, so it can be NULL, and `order by exact desc`
        # puts NULLs FIRST in Postgres. Uncoalesced, typing a GR number sorts the
        # right answer BELOW the fuzzy ones.
        #
        # Assertions 39-42 cover the date arithmetic: a birthday already past
        # rolls to next year rather than reporting negative days, and 29 February
        # resolves in a non-leap year instead of raising from make_date.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/search_birthdays.sql

      - name: Staff leaving
        # Assertion 19 is the reason 0053 exists. The old "Deactivate" button
        # wrote staff.status, and NOTHING anywhere reads staff.status — every
        # access check goes through profiles.active. A resigned teacher could
        # therefore log in the next morning and mark attendance. Assertions 31-33
        # do not check that a column changed: they become the departed teacher
        # and assert is_staff(), has_role() and current_school_id() all refuse
        # her.
        #
        # Assertions 16-18 are the transactional half. fn_staff_leave writes the
        # status, vacates the class-teacher slots and drops the assignments
        # BEFORE it touches the login, so if the "only active owner" guard fired
        # and the function were not one transaction, a school would be left with
        # an owner marked as gone who can still log in.
        #
        # Assertion 27 is the other direction: a session that had already ended
        # keeps its assignment, because "who taught 1-A in 2023-24" must still be
        # answerable after the teacher has gone.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/staff_leaving.sql

      - name: When a child leaves
        # fn_set_student_status is how children leave a school and it drives
        # billing, and it had NO suite at all until 0054. Writing one found two
        # defects.
        #
        # Assertion 9 is the one a parent would care about: the UI offered only
        # "Strike off", so a family moving city was recorded as removal for
        # non-payment or misconduct. Assertions 18-22 cover the contradiction —
        # reinstating a graduated child used to leave students.status = 'active'
        # with the enrollment still 'graduated', a child reading as a current
        # pupil while in no class, billed nothing and counted against no plan
        # limit — and prove the refusal leaves nothing behind.
        #
        # Assertions 13-16b are the money, asserted by generating invoices and
        # counting rather than by reading columns: leaving stops next month's
        # challan and the plan count, the month they WERE here is not erased,
        # and a child whose student record and enrollment DISAGREE is not billed
        # either.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/student_status.sql

      - name: Year-end rollover
        # The operation that touches every child, runs once a year, and had no
        # suite at all. Writing one found the most serious defect in this
        # project: fn_rollover picked "the next class up" with
        # `select id from public.classes where active and level_order > ...` —
        # no school anywhere in it, inside a SECURITY DEFINER function where RLS
        # never applies. On a live multi-tenant deployment a school's rollover
        # promoted its children into ANOTHER SCHOOL'S classroom.
        #
        # Assertion 6 is the ordinary case, not an edge case: two schools with
        # the same ladder tie on level_order and the winner is whichever row the
        # heap returns first. Assertion 7 is the other shape — a school with no
        # class above its top one promoting into another school's higher class
        # instead of graduating. Assertion 21 sweeps every enrolment in the
        # database and asserts none points at a class belonging to another
        # school.
        #
        # Assertion 28 covers the second leak: fn_rollover_undo counted
        # graduated children across every tenant and handed the total to this
        # school's principal.
        #
        # dashboard.sql assertion 20 could not catch any of this. It checks that
        # a SECURITY DEFINER function MENTIONS scoping somewhere in its body, and
        # fn_rollover calls assert_own on both session ids — so one correct check
        # exempted eight incorrect ones.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rollover.sql

      - name: The go-live importers
        # The first two tools a school touches: paste the register, paste last
        # year's arrears. Neither had a suite, and both looked children up across
        # every school on the platform.
        #
        # The fixture turns on one fact — gr_no is a per-school counter, so every
        # school has a GR 0001 — and makes school B's counter run AHEAD of school
        # A's so that B holds a GR number A genuinely does not. The first version
        # of assertion 2 used a number both schools happened to have, which made
        # the "duplicate" it complained about a real one and the assertion
        # vacuous.
        #
        # Assertion 2 is the student-import bug, 4 and 6 the opening-balance one,
        # and 17/19 check the money actually lands where student_balance() reads
        # it and does not double on a re-run.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/importers.sql

      - name: Photographs — can one school reach another school's faces?
        # Storage is the one part of this product where the access rule is NOT
        # table RLS. It is four policies on storage.objects, matching on the
        # object's NAME, and that changes what can go wrong: a path is a string,
        # and a string a client chooses is a folder a client chooses.
        #
        # There is no storage schema in CI, so this suite builds a faithful stub
        # of storage.objects — same columns, same RLS-enabled table, same four
        # policies, the real fn_may_read_school_file / fn_may_write_school_file —
        # and drives it as `authenticated` in BOTH directions: school A must not
        # read, write, overwrite or delete school B's objects, and vice versa.
        # Testing one direction only would pass on a policy that happened to be
        # scoped to whichever school the fixture created first.
        #
        # It also asserts the three CHECK constraints refuse a malformed path
        # outright, and that the setter functions DERIVE the path rather than
        # storing what they are handed — the property that makes "upload into
        # another school's folder" inexpressible from the client at all.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/photos.sql

      - name: The result card — is a pupil marked out of their OWN subjects?
        # The generator was confidently wrong in three ways at once, and the
        # arithmetic was plausible enough that nobody would have questioned it.
        # Reproduced on a real database before it was touched: a class-9 pupil
        # with 160 of the 175 marks they actually sat was printed as 160/275 =
        # 58.18%, grade D. Their Arts classmate on 180/200 = 90% was printed as
        # 65.45%, grade C. And the wrong denominator punished the Science pupil
        # harder, so the RANKING inverted and prize day would have gone to the
        # wrong child. A third pupil, whose marks were simply not typed in yet,
        # printed as 0.00%, grade F, ranked third.
        #
        # Every rule here has a specific defect behind it. The two that matter
        # most for how the assertions are written:
        #
        #  * The two streams have DIFFERENT paper totals (Physics 75, Civics
        #    100). With equal totals a wrong denominator produces the right
        #    answer by accident and the whole suite passes on broken code.
        #  * The ranking is asserted as an ORDER, not as two percentages. The
        #    old defect got both numbers wrong in a way that also swapped them;
        #    testing the numbers alone catches one fault and not the other.
        #
        # Assertions 30-34 are the provisional-card rules, which have to hold
        # TOGETHER: a card generated with marks missing must say so AND leave
        # the unmarked papers out of its denominator AND take no position. One
        # without the others is the original defect with a label on it.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/exam_computation.sql

      - name: The observer role — can it write anywhere?
        # `readonly` was incoherent in both directions at once. The dashboard
        # showed it the school's takings while every screen it could click
        # through to returned ZERO ROWS, because its SELECT policies named
        # explicit roles and readonly was not among them. Somebody in that seat
        # concludes the software has lost the data — and it is the FALLBACK role,
        # so that was the experience of any invited login whose role nobody set.
        #
        # THE WORSE HALF, and the reason assertions 14-19 count rows instead of
        # catching exceptions: RLS treats the write verbs differently. INSERT with
        # no matching policy RAISES; UPDATE and DELETE affect ZERO ROWS and raise
        # NOTHING. Every direct-table write in db.ts checked only `error`, so a
        # blocked save reported "Saved." over an unchanged record. There is no
        # exception to assert on — only a row count and the value afterwards.
        #
        # Assertion 27 is the trap in the whole approach: fn_may_manage_class and
        # fn_may_write_school_file are STABLE and look exactly like read gates,
        # but they AUTHORISE WRITES elsewhere — a teacher's mark entry and a
        # storage upload policy consult them. If may_view ever reaches either, an
        # observer can enter marks and overwrite a child's photograph, and
        # nothing at the call site looks wrong.
        #
        # Assertion 29 stops the suite going vacuous: a migration that reverted
        # every read gate to has_role would pass 25-28 perfectly, by having
        # nothing left to find.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/readonly_role.sql

      - name: Refundable deposits — is a security deposit counted as PROFIT?
        # It was. Reproduced on a real database: one pupil, Rs 2,000 tuition plus
        # a Rs 5,000 REFUNDABLE deposit, family pays all 7,000 — and
        # fn_finance_summary reported fee_income 7,000 and profit 7,000. A deposit
        # is money the school HOLDS and must give back. At 200 pupils that is a
        # million rupees of profit that is a liability, and a proprietor pays a
        # salary out of it. There was also no way at all to record a refund, and
        # nothing anywhere read fee_heads.is_refundable.
        #
        # Assertions 1 and 2 test BOTH insert orders on the mixed-invoice rule.
        # The trigger counts refundable and ordinary lines, so a check that only
        # adds a deposit to a tuition invoice passes on half a bug.
        #
        # Assertion 18 is the one that would be easiest to get wrong and hardest
        # to notice: netting a deposit against arrears must move the BALANCE and
        # not the CASH. The tempting implementation is a payments row, which would
        # put money nobody handed over into the day book and the till, and the
        # drawer would not balance. It is an adjustment.
        #
        # Assertion 30 keeps a liability from shrinking when a child leaves — a
        # pupil who has gone and not been refunded is precisely the money still
        # owed. Assertion 32 is the safety property: a school with no refundable
        # head sees no change to any figure at all.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/deposits.sql

      - name: Certificates — the SLC, the dues lever, and the leaving it must record
        # Reproduced on a real database. One pupil, STILL ENROLLED, owing
        # Rs 4,000. A leaving certificate was requested and:
        #
        #   issued ............................ yes, serial 1
        #   students.status afterwards ........ 'active', left_on null
        #   snapshot .......................... name, father, class, roll. Nothing else.
        #   issued again ...................... serial 2, also looking original
        #   way to cancel one issued in error . none
        #
        # Each of those is a separate failure in a school. The dues gate is the
        # one lever a school has for unpaid fees and it did not exist. Issuing
        # without recording the leaving leaves a child on the attendance
        # register, in the class strength and in next month's billing while
        # holding a certificate saying they left. An SLC that does not state the
        # dates of attendance is not an SLC. And two indistinguishable originals
        # let a family present one at each of two schools.
        #
        # Assertions 40-46 are a defect found by probing this migration's OWN
        # code, not the code it replaced: `p_data` — the free-form field a clerk
        # types into — was merged OVER the frozen snapshot, so a caller could
        # send {"is_duplicate": false, "dues_cleared": true, "student_name":
        # "Somebody Else"} and get a legitimate serial printing a different
        # child's name with no DUPLICATE stamp and the fees shown as cleared.
        # "The app doesn't send those keys" is not a boundary, and a certificate
        # is exactly the document somebody has a motive to forge. Assertion 46
        # is the other half: locking it down must not empty it — purpose and
        # remarks still have to reach the document.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/certificates.sql

      - name: Staff QR check-in — was the QR doing anything at all?
        # It was not. Probed on a real database: one teacher, login linked to her
        # staff record, sitting at home.
        #
        #   inserted her own attendance row ......... yes. No QR code involved.
        #     with source = 'qr' and code_id null ... and nothing read code_id
        #   back-dated seven days she never worked .. yes
        #   the code ............................... 32 static hex chars, no expiry
        #   check-out / lateness / school day ....... none of the three existed
        #
        # staff_att_insert allowed `staff_id = my_staff_id()`, and
        # fn_staff_check_in has been SECURITY DEFINER all along — so that policy
        # branch was never needed for the feature to work, and it handed away the
        # entire mechanism. On a school that pays by attendance, the back-dating
        # is payroll fraud in one call.
        #
        # Assertions 1-3 are worth more than the rest of the file put together:
        # the rotating code is a lock, and this is the wall next to it.
        #
        # Assertion 8 is the one that keeps the rotation honest — a rotating code
        # that still accepts its own bare code is decorative in exactly the way
        # the direct insert was. 14 and 15 are the pair that matter for the
        # window: the PREVIOUS 30 seconds must work (a token has to survive the
        # second between the screen and the phone) and two minutes ago must not.
        #
        # Assertion 32 exists because of a mistake in the first draft: it logged
        # the refusal and then RAISED, which logs nothing — plpgsql has no
        # autonomous transaction, so the raise rolls the log row back with it. The
        # refusal register would have been permanently empty and the brute-force
        # counter that reads it would never have counted past zero. Refusals
        # return; the web wrapper turns them back into thrown errors.
        #
        # Everything after the fixture runs as `authenticated`, because RLS does
        # not apply to a table's owner and a negative assertion made as postgres
        # would pass with no policies at all. That is also how the 0063 defect
        # surfaced.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/staff_checkin.sql

      - name: The operator's own books — could the seller answer what a school owes?
        # No. The product's promise to a school is that every rupee has a row;
        # the person selling it kept none. Reproduced on a real database — three
        # customer schools, Al-Noor renews twelve months of `growth`:
        #
        #   what was Al-Noor charged? ......... no table records a charge
        #   how much has Al-Noor ever paid? ... no function answers it
        #   which schools owe us money? ....... unanswerable
        #   who granted it, and when? ......... audit_log had zero rows for it
        #
        # The subtle one is "which schools owe us money". The console shows
        # days_left, so it LOOKS like it answers that — but a school that renewed
        # on trust and never paid is indistinguishable from one that paid in
        # full. Both show 335 days left. The receivable was invisible precisely
        # because the screen looked like it was showing it.
        #
        # Assertions 4-7 are a revenue leak found in the same probe: Al-Noor is
        # on growth (limit 300) with 420 students, the console itself computed
        # limit_state='over' and suggested_plan='institution', and the renewal
        # put them back on growth for another year at the 300-student price. The
        # screen knew; the renewal path never asked. 6 and 7 are the halves that
        # matter — a refused renewal must leave neither an invoice nor a moved
        # period behind.
        #
        # Assertions 13-17 defend the discount rule in both directions: a price
        # that is not the list price needs a reason, INCLUDING zero, and a zero
        # charge still activates the school. A free year that leaves no trace is
        # how a business loses track of what it has given away.
        #
        # Assertions 38-46 are the boundary. A school's own OWNER must read none
        # of the operator's books — not even invoices raised against their own
        # school — and the operator, with every billing power there is, must
        # still read no student, no fee invoice and no receipt. Adding the
        # operator's books must not widen the operator's reach.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/operator_billing.sql

      - name: Provisioning — could a parent make themselves principal?
        # They could. handle_new_user() read a new login's SCHOOL and ROLE from
        # new.raw_user_meta_data, which is whatever the browser passes to
        # auth.signUp({options:{data:{...}}}) with the PUBLIC anon key.
        # 'principal' and 'accountant' were both on its accepted-role list, and
        # an accepted role was created ACTIVE. Two strangers signed up naming a
        # victim school and became an active accountant and an active principal
        # in it, both passing has_role() and may_view().
        #
        # Every signed-in user already knows their own school_id, so the floor on
        # this was: any parent, teacher or clerk could create a second login and
        # become PRINCIPAL of their own school. Reaching another school needed
        # only its UUID, which leaks through a screenshot or a support chat.
        #
        # The whitelist was not the bug. 0059 added it and it correctly stopped
        # an UNRECOGNISED role landing active. The bug was that a RECOGNISED role
        # was believed at all, because the thing supplying it is the attacker.
        #
        # Assertion 3 tries EVERY role on that old list, not just 'principal' —
        # the defect was found on 'accountant' first, and a gate that holds for
        # one and leaks for another is not a gate. Assertion 5 is the distinction
        # that matters: the LOGIN is still created, because refusing signups is
        # not the fix; what is refused is the login deciding what it may do.
        #
        # Assertions 22-24 are a flaw found in the FIX rather than the original
        # code. The first trigger took "order by created_at desc limit 1" among
        # matching invitations, which is arbitrary when two rows share a
        # timestamp — and both do when written in one transaction, since now() is
        # the transaction's start. Two schools inviting one address is ordinary
        # in Pakistan (a teacher at both), and a profile carries ONE school_id,
        # so guessing puts that person inside one school's pupil records while
        # the other believes they are in. It now refuses and leaves both pending.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/provisioning.sql

      - name: No authorisation is decided from client-controlled metadata
        # The structural half of the fix above. `raw_user_meta_data->>'role'`
        # reads exactly like `raw_app_meta_data->>'role'`, so the fix is one
        # plausible-looking line away from being undone.
        #
        # Checks three things, because the obvious check alone is not enough: no
        # function reads a non-display key from the untrusted field; AND
        # handle_new_user still reads the trusted field; AND it still consults
        # user_invites. Without the last two, deleting the function body
        # entirely would report healthy.
        run: python3 supabase/check-metadata-trust.py

      - name: Every suite on disk has a step above
        # The gap this closes has already happened twice in this repo, in two
        # different places: supabase/bundles/ stopped at 0039 while CI stayed
        # green, and fn_reverse_other_income shipped with no caller. Both were
        # "the artefact exists, nothing runs it".
        #
        # A test suite added without a step here is the same failure: the file is
        # in the repo, it passes on a laptop, and CI never opens it. Comparing
        # the directory against this file is the only thing that notices.
        run: |
          missing=0
          for f in supabase/tests/*.sql; do
            b=$(basename "$f")
            if ! grep -q -F "tests/$b" .github/workflows/ci.yml; then
              echo "NO CI STEP RUNS supabase/tests/$b"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo
            echo "Add a step above that runs it. A suite CI never opens is not a test."
            exit 1
          fi
          echo "all $(ls supabase/tests/*.sql | wc -l) suites are run by a step above"

      - name: Message settings — does switching a message off actually stop it?
        # message_templates has carried an `enabled` flag since 0034 that
        # nothing in the app could set. A toggle that only greys out a checkbox
        # while parents keep receiving the message is worse than no toggle, so
        # this asserts a disabled template writes NO outbox row — including
        # through the bulk "WhatsApp everyone who owes" path, which loops and
        # swallows per-family errors.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/message_settings.sql

      - name: Dashboard — is every figure this school's own?
        # fn_dashboard_summary is SECURITY DEFINER, so RLS does not apply to it,
        # and three of its queries had NO school filter: "New this month",
        # "Collected today" and "Collected this month" were summed across every
        # school in the database. A school with one student and no payments was
        # shown 271 admissions and Rs 24,577 collected.
        #
        # tenant_isolation.sql could not catch this — it tests table access, and
        # the leak was inside a function where policies are never consulted. So
        # this suite loads school B with much larger numbers and asserts every
        # figure school A reports is A's own. Also covers "never billed" not
        # rendering as "nothing owed", and a Rs 0 challan not counting as billed.
        #
        # It also carries the STRUCTURAL guard (assertion 20): every SECURITY
        # DEFINER function that reads a school_id-bearing table must scope
        # itself, with reviewed exceptions listed in the file. That guard is
        # what turns "we audited them once" into something CI enforces — and it
        # was verified to fail on a deliberately planted unscoped function.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/dashboard.sql

      - name: Student list — does the fast balance equal the real one?
        # fn_student_list recomputes each balance SET-BASED rather than calling
        # student_balance() per row, because per-row is 800 correlated
        # subqueries on a real school. That is only acceptable if the two agree
        # exactly, so assertion 1 compares them row by row over a fixture with
        # charges, a discount, a fine, an adjustment, a part payment and a
        # reversal. Also: total_count is the whole set not the page, paging
        # loses nobody, and a typed "%" is a character rather than a wildcard
        # that returns the entire school.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/student_list.sql

      - name: Bulk collection — is a bad batch really all-or-nothing?
        # The load-bearing assertion: ten good rows and a bad eleventh must
        # leave NOTHING behind, because a clerk who cannot tell which of forty
        # rows went through has no way to recover. Also that bulk payments
        # allocate identically to counter payments (they go through the same
        # function by design), that receipts stay distinct across a batch, and
        # that reminders go once per FAMILY and escalate on repeats.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bulk_fees.sql

      - name: Challan — does the printed slip agree with the ledger?
        # A challan is the only artefact a parent can hold up and argue with, so
        # this asserts total_payable == student_balance() exactly, that the two
        # halves a parent reads add up to it, that previous dues are computed
        # live rather than from the generation-time snapshot (which would demand
        # money already paid), that void challans never print, and that the
        # batch is roll-ordered numerically and does not leak another school.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/challan.sql

      - name: Fee counter — are the figures on the busiest screen right?
        # The counter opens on four numbers and the day's receipts. Asserts a
        # pending bank transfer never inflates "collected today" (the drawer
        # would look short at closing), that pending money is still reported
        # rather than hidden, that the unpaid-challan count is derived from
        # allocations and falls when one is settled, and that neither read
        # leaks across schools or is callable by a parent.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/counter.sql

      - name: Parent access — can a parent ever reach the portal?
        # portal.sql's fourteen assertions all passed while the portal was
        # unreachable, because its fixture set profiles.family_id by hand.
        # Nothing in the app wrote that column. This suite goes through
        # fn_link_parent instead, and also covers the separate bug it turned up:
        # profiles.active was written by the Settings screen and read by
        # nothing, so "Deactivate" left a dismissed clerk with full access.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/parent_access.sql

      - name: Family linkage — do siblings actually share a family?
        # The suite above passed for weeks while family billing was completely
        # broken in production, because it built its families with direct
        # INSERTs. Nothing in the app does that: admissions go through
        # fn_admit_student, which never set family_id, so every real student got
        # a family to themselves and no payment ever spanned siblings.
        #
        # This suite admits students the way the app does and never inserts a
        # family or a student directly. If it is ever "simplified" into building
        # its own fixtures, it stops testing anything.
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/family_linkage.sql

      - name: Every suite again, in reverse order
        # Suites are supposed to be independent. They are not, automatically:
        # counter.sql passed alone and failed after fee_ops.sql, because
        # fee_ops.sql COMMITS a profile row and counter.sql's fixture upserted
        # the same UUID without updating full_name. A suite that only passes in
        # the position it happens to occupy in this file is a suite that will
        # break the day someone reorders the list.
        #
        # Globbed rather than listed, so a new suite is covered the moment it is
        # added and this step cannot drift out of date the way a hand-kept list
        # does.
        run: |
          for f in $(ls supabase/tests/*.sql | sort -r); do
            echo "::group::reverse $f"
            psql -v ON_ERROR_STOP=1 -f "$f" > /dev/null || {
              echo "::error::$f fails when run in reverse order — it depends on another suite"
              exit 1
            }
            echo "::endgroup::"
          done
          echo "all suites pass in reverse order too"
